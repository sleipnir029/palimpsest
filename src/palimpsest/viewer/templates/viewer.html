<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>palimpsest — {{ filename }}</title>
  <!-- HTMX for T30's data-pane loads (CDN per T29 card) -->
  <script src="https://unpkg.com/htmx.org@latest"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #layout { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
    #pdf-pane { overflow-y: auto; background: #525659; padding: 1rem; }
    #pdf-pane .page-wrap { position: relative; margin: 0 auto 1rem; }
    #pdf-pane canvas { display: block; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
    #data-pane { overflow-y: auto; padding: 1rem; border-left: 1px solid #ddd; }
    header { font-size: .85rem; color: #888; margin-bottom: .75rem; }
    #data-pane header { color: #666; }
    .value { padding: .25rem .4rem; border-radius: 3px; cursor: pointer;
             font-size: .9rem; }
    .value:hover { background: #fdf3c0; }
    /* T31 hover overlay: semi-transparent yellow box over the source bbox. */
    .bbox-overlay { position: absolute; pointer-events: none;
                    background: rgba(255, 235, 59, .4);
                    border: 1px solid rgba(245, 200, 0, .9); }
    /* WS1 correction UI */
    .value.corrected .label { text-decoration: line-through; opacity: .6; }
    .value .corr-note { display: block; color: #b8860b; font-size: .8rem; cursor: default; }
    .correction-form { margin: .4rem 0 .5rem; padding: .5rem; background: #f7f7f7;
                       border: 1px solid #ddd; border-radius: 4px;
                       display: grid; gap: .35rem; cursor: default; }
    .correction-form input { font: inherit; }
    .correction-form .cf-value { width: 8rem; }
    .correction-form .cf-unit { width: 6rem; }
    .correction-form textarea { width: 100%; min-height: 2.5rem; font: inherit; }
    .correction-form button { font: inherit; }
    .correction-form .cf-msg { color: #c0392b; font-size: .8rem; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="pdf-pane">
      <header>{{ filename }}{% if page_count %} · {{ page_count }} pages{% endif %} · {{ sha[:12] }}…</header>
      <div id="pdf-canvases"></div>
    </div>
    <div id="data-pane">
      <header>extracted data</header>
      <!-- T30 populates this div; T31 wires hover -> bbox highlight. -->
    </div>
  </div>

  <!-- T31: highlightBox()/clearHighlights() globals, used by the rows below. -->
  <script src="/static/pdf-overlay.js"></script>

  <script type="module">
    import * as pdfjsLib from "/static/pdfjs/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "/static/pdfjs/pdf.worker.min.mjs";

    const SCALE = 1.4;
    const container = document.getElementById("pdf-canvases");

    // Shared with pdf-overlay.js: page number -> { viewport, wrap }. The overlay
    // needs the PageViewport (for convertToViewportRectangle) and a positioned
    // ancestor to absolutely-place the highlight div into.
    window.palimPages = {};

    (async () => {
      // cMapUrl/standardFontDataUrl let PDF.js render CID/CJK-encoded PDFs and
      // PDFs that don't embed their fonts — both vendored under /static/pdfjs/.
      const pdf = await pdfjsLib.getDocument({
        url: "/paper/{{ sha }}/pdf",
        cMapUrl: "/static/pdfjs/cmaps/",
        cMapPacked: true,
        standardFontDataUrl: "/static/pdfjs/standard_fonts/",
      }).promise;
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const viewport = page.getViewport({ scale: SCALE });
        const wrap = document.createElement("div");
        wrap.className = "page-wrap";
        wrap.style.width = viewport.width + "px";
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        wrap.appendChild(canvas);
        container.appendChild(wrap);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        window.palimPages[n] = { viewport, wrap };
      }
    })();

    // Data pane: /data is JSON (T30, do-not-touch), so fetch + render rows here
    // rather than HTMX-swapping. Each row carries page/bbox/parser for the hover
    // highlight + the measurement id (data-id) for corrections (WS1). Click a row
    // to open an inline correction form; the latest correction (if any) is shown.
    (async () => {
      const sha = "{{ sha }}";
      const pane = document.getElementById("data-pane");
      const { triples } = await (await fetch(`/paper/${sha}/data`)).json();
      const { corrections } = await (await fetch(`/paper/${sha}/corrections`)).json();
      const latest = {};  // measurement id -> newest correction (query is oldest-first)
      for (const c of corrections) latest[c.measurement_id] = c;

      for (const t of triples) {
        const row = document.createElement("div");
        row.className = "value";
        row.dataset.id = t.id;
        row.dataset.page = t.page;
        row.dataset.bbox = JSON.stringify(t.bbox);
        row.dataset.parser = t.parser_name;

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = `${t.slot_path}: ${t.value}${t.unit ? " " + t.unit : ""}`;
        row.appendChild(label);

        row.onmouseover = () => highlightBox(row);
        row.onclick = (e) => { if (!e.target.closest(".correction-form, .corr-note")) toggleForm(row, t); };
        if (latest[t.id]) markCorrected(row, latest[t.id]);
        pane.appendChild(row);
      }

      function markCorrected(row, c) {
        row.classList.add("corrected");
        let note = row.querySelector(".corr-note");
        if (!note) { note = document.createElement("small"); note.className = "corr-note"; row.appendChild(note); }
        const to = c.flagged_wrong
          ? "flagged wrong"
          : `→ ${c.corrected_value ?? ""}${c.corrected_unit ? " " + c.corrected_unit : ""}`;
        note.textContent = `corrected by ${c.author} ${to} — ${c.comment}`;
      }

      function toggleForm(row, t) {
        const open = row.querySelector(".correction-form");
        if (open) { open.remove(); return; }
        const form = document.createElement("div");
        form.className = "correction-form";
        const v = t.value ?? "", u = t.unit ?? "";
        form.innerHTML = `
          <label>value <input class="cf-value" type="number" step="any" value="${v}"></label>
          <label>unit <input class="cf-unit" value="${u}"></label>
          <label><input class="cf-flag" type="checkbox"> flag wrong (no replacement)</label>
          <textarea class="cf-comment" placeholder="why is this wrong / what is correct (required)"></textarea>
          <div><button class="cf-save">save correction</button>
               <button class="cf-cancel">cancel</button>
               <span class="cf-msg"></span></div>`;
        row.appendChild(form);
        form.querySelector(".cf-cancel").onclick = () => form.remove();
        form.querySelector(".cf-save").onclick = () => saveCorrection(row, t, form);
      }

      async function saveCorrection(row, t, form) {
        const msg = form.querySelector(".cf-msg");
        const comment = form.querySelector(".cf-comment").value.trim();
        if (!comment) { msg.textContent = "comment required"; return; }
        const flagged = form.querySelector(".cf-flag").checked;
        const payload = { measurement_iri: t.id, comment, flagged_wrong: flagged };
        if (!flagged) {
          const vRaw = form.querySelector(".cf-value").value.trim();
          const uRaw = form.querySelector(".cf-unit").value.trim();
          if (vRaw !== "" && Number(vRaw) !== t.value) payload.new_value = Number(vRaw);
          if (uRaw !== "" && uRaw !== (t.unit ?? "")) payload.new_unit = uRaw;
          if (payload.new_value === undefined && payload.new_unit === undefined) {
            msg.textContent = "change a value/unit or check flag wrong"; return;
          }
        }
        msg.textContent = "saving…";
        const res = await fetch(`/paper/${sha}/correct`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) { msg.textContent = "error: " + await res.text(); return; }
        form.remove();
        markCorrected(row, {
          author: "human", comment,
          corrected_value: payload.new_value ?? null, corrected_unit: payload.new_unit ?? null,
          flagged_wrong: flagged,
        });
      }
    })();
  </script>
</body>
</html>
