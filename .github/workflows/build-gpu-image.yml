# Build the palimpsest parser images and push to Docker Hub.
# One isolated image per parser we build ourselves. T17 5-parser set: docling, mineru, chandra,
# paddle (PaddleOCR PP-StructureV3), and dots (dots.ocr — added once its Dockerfile lands).
# olmOCR was dropped in T17 (FP8/Ada-only vendor image; see DEVIATIONS.md, T12 superseded).
# Manual trigger only — avoids surprise builds and Actions-minute burn.
# Needs repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
name: Build parser images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Each image builds independently; one parser failing does not cancel the rest.
      fail-fast: false
      matrix:
        parser: [docling, mineru, chandra, paddle, dots]
    steps:
      - uses: actions/checkout@v4

      # Each image is ~12-15 GB; the default runner has too little free disk.
      # Reclaim ~25 GB by removing preinstalled toolchains we do not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/palimpsest-${{ matrix.parser }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/palimpsest-${{ matrix.parser }}:0.2.1
          # Push a plain single-image manifest. Without these, buildx attaches a
          # provenance/SBOM attestation, producing an OCI index that RunPod's
          # image puller rejects: "layers from manifest don't match image
          # configuration". See DEVIATIONS.md.
          provenance: false
          sbom: false
